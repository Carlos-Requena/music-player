<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1B2236"/>
      <stop offset="1" stop-color="#07090F"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.36" r="0.55">
      <stop offset="0" stop-color="#F2553D" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#F2553D" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E9ECF1"/>
      <stop offset="0.5" stop-color="#9AA1AD"/>
      <stop offset="1" stop-color="#DDE1E8"/>
    </linearGradient>
  </defs>
  <!-- Fondo con la forma de icono de macOS (cuadrado redondeado con margen). -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#ground)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#glow)"/>
  <!-- Lomos de la estantería a la izquierda. -->
  <rect x="214" y="300" width="44" height="400" rx="6" fill="#0E6470"/>
  <rect x="268" y="300" width="44" height="400" rx="6" fill="#C8743A"/>
  <!-- Disco asomando de su caja. -->
  <circle cx="610" cy="500" r="200" fill="url(#disc)"/>
  <circle cx="610" cy="500" r="120" fill="#F2553D"/>
  <circle cx="610" cy="500" r="74" fill="#FFB070"/>
  <circle cx="610" cy="500" r="26" fill="#07090F"/>
  <!-- Caja (portada) delante del disco. -->
  <rect x="330" y="300" width="320" height="400" rx="10" fill="#E8472F"/>
  <circle cx="490" cy="455" r="92" fill="#FFB070"/>
  <circle cx="490" cy="455" r="52" fill="#FFE7B8"/>
  <rect x="330" y="540" width="320" height="160" fill="#0E6470"/>
  <rect x="330" y="300" width="320" height="400" rx="10" fill="none" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="6"/>
</svg>
