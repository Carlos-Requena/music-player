[package]
name = "musicplayer-login"
version = "0.1.0"
edition = "2021"
description = "Ventana de inicio de sesión de YouTube Music para Linux (Qt WebEngine) y Windows (WebView2), en un proceso aparte"

[[bin]]
name = "musicplayer-login"
path = "src/main.rs"

[build-dependencies]
cc = "1"

# Windows: WebView2 (el motor de Edge del sistema); el cargador va enlazado estático.
[target.'cfg(windows)'.dependencies]
webview2-com = "0.38"
windows = { version = "0.61", features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_System_Com", "Win32_System_LibraryLoader", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
