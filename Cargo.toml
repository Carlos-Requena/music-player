[package]
name = "musicplayer"
version = "0.1.0"
edition = "2021"
description = "Cliente de escritorio ligero para YouTube Music (Qt 6 / QML + Rust)"

[workspace]
# `login`: ventana de inicio de sesión de Linux (Qt WebEngine) y Windows (WebView2), en un
# binario aparte para que el reproductor no cargue un motor web en memoria.
members = ["login"]
default-members = [".", "login"]

[dependencies]
base64 = "0.22"
cxx = "1.0.95"
cxx-qt = "0.10"
cxx-qt-lib = { version = "0.10", features = ["qt_gui", "qt_qml"] }
dirs = "6"
flate2 = "1"
md5 = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
souvlaki = { version = "0.9", default-features = false, features = ["use_zbus"] }
ureq = { version = "3", features = ["json"] }

# Windows: tuberías con nombre para mpv y Discord, y el «job» que cierra a los hijos.
[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_JobObjects", "Win32_System_Threading"] }

[build-dependencies]
cc = "1"
cxx-qt-build = { version = "0.10", features = ["link_qt_object_files"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
